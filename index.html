<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lift-Consulting Menzel GmbH</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#1a1a2e;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px}
.logo-wrap{text-align:center;margin-bottom:36px}
.logo-wrap img{max-width:200px;border-radius:8px}
.subtitle{color:#aaa;font-size:14px;margin-top:8px;letter-spacing:.5px}
h1{color:#fff;font-size:20px;font-weight:600;margin-bottom:4px;text-align:center}
.cards{display:flex;flex-direction:column;gap:16px;width:100%;max-width:400px}
.card{display:block;padding:24px 28px;border-radius:14px;text-decoration:none;border:2px solid transparent;transition:transform .15s,border-color .15s;cursor:pointer}
.card:active{transform:scale(.97)}
.card-de{background:#0d47a1;border-color:#1565c0;color:#fff}
.card-de:hover{border-color:#42a5f5}
.card-fr{background:#1b5e20;border-color:#2e7d32;color:#fff}
.card-fr:hover{border-color:#66bb6a}
.card-flag{font-size:40px;display:block;margin-bottom:10px}
.card-title{font-size:20px;font-weight:700;display:block;margin-bottom:4px}
.card-desc{font-size:14px;opacity:.8;display:block}
.footer{color:#555;font-size:12px;margin-top:40px;text-align:center}
</style>
</head>
<body>
<div class="logo-wrap">
  <h1>Lift-Consulting Menzel GmbH</h1>
  <div class="subtitle">Formular-App / Application formulaire</div>
</div>
<div class="cards">
  <a href="formular-de.html" class="card card-de">
    <span class="card-flag">🇩🇪</span>
    <span class="card-title">Abnahmeprotokoll Aufzug</span>
    <span class="card-desc">Deutsch &mdash; Aufzugsabnahme, Pr&uuml;fprotokoll, PDF-Export</span>
  </a>
  <a href="formular-fr.html" class="card card-fr">
    <span class="card-flag">🇫🇷</span>
    <span class="card-title">PV de r&eacute;ception ascenseur</span>
    <span class="card-desc">Fran&ccedil;ais &mdash; R&eacute;ception ascenseur, contr&ocirc;le, export PDF</span>
  </a>
</div>
<div class="footer">&copy; 2024 Lift-Consulting Menzel GmbH</div>
</body>
</html>
